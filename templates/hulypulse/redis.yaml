{{- define "redis.spec" -}}
podSecurityContext:
  runAsUser: 1000
  fsGroup: 1000
kubernetesConfig:
  image: quay.io/opstree/redis:v8.0.3
  imagePullPolicy: IfNotPresent
  redisSecret:
    name: hulypulse
    key: redisSecret
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 100m
      memory: 512Mi
storage:
  volumeClaimTemplate:
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
{{- end -}}

{{- if eq .Values.hulypulse.redisMode "replication" }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name:  hulypulse-redis
spec:
  clusterSize: 3
{{ include "redis.spec" . | indent 2 }}
{{- end }}

{{- if eq .Values.hulypulse.redisMode "standalone" }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name:  hulypulse-redis
spec:
{{ include "redis.spec" . | indent 2 }}
{{- end }}

---

{{- if eq .Values.hulypulse.redisMode "replication" }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: hulypulse-redis
spec:
  clusterSize: 3
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  redisSentinelConfig:
    redisReplicationName: hulypulse-redis
    masterGroupName: mymaster
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.0.3
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: hulypulse
      key: redisSecret
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
{{- end }}